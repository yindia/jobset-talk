# Gang scheduling with Workload-Aware Scheduling: one gang per role.
# The demo cluster has 3 workers x 2 fake GPUs = 6 GPUs.
#   driver  : 1 Job  x 1 pod, no GPU      -> PodGroup gang minCount 1
#   workers : 2 Jobs x 2 pods, 1 GPU each -> PodGroup gang minCount 4
# JobSet compiles this into 1 Workload -> 2 PodGroupTemplates -> 2 PodGroups.
# It keeps running (holding 4 of the 6 GPUs) so the next demo has to wait.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: train
spec:
  scheduling:
    replicatedJobs:
    - targetReplicatedJobs: [driver]
      schedulingPolicy:
        gang: {}
    - targetReplicatedJobs: [workers]
      schedulingPolicy:
        gang: {}
      disruptionMode:
        all: {}
  replicatedJobs:
  - name: driver
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        template:
          spec:
            containers:
            - name: driver
              image: busybox:1.37
              command: ["sh", "-c", "sleep 3600"]
  - name: workers
    replicas: 2
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          spec:
            containers:
            - name: worker
              image: busybox:1.37
              command: ["sh", "-c", "sleep 3600"]
              resources:
                limits:
                  example.com/gpu: 1
