# Baseline: the same "big" workload WITHOUT spec.scheduling.
# The default scheduler places pods one at a time: 2 workers start (holding the
# last 2 GPUs) and 2 stay Pending. Partial placement, and no useful work.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: big-no-gang
spec:
  replicatedJobs:
  - name: driver
    replicas: 1
    template:
      spec:
        template:
          spec:
            containers:
            - name: driver
              image: busybox:1.37
              command: ["sh", "-c", "sleep 3600"]
  - name: workers
    replicas: 2
    template:
      spec:
        parallelism: 2
        completions: 2
        template:
          spec:
            containers:
            - name: worker
              image: busybox:1.37
              command: ["sh", "-c", "sleep 3600"]
              resources:
                limits:
                  example.com/gpu: 1
